name: Windows Build

on:
  push:
    branches:
      - main
      - stage-2-midi-router
      - stage-3-chord-harmonizer

jobs:
  build:
    runs-on: windows-latest

    env:
      SMART_VOICING_PACKAGE_NAME: "Smart Voicing 0.2d"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --target SmartVoicing_VST3 SmartVoicingARA_VST3 SmartVoicingCoreTests SmartVoicingHarmonizerTests SmartVoicingLiveReharmonizerTests --parallel 2

      - name: Test Harmony Core
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare versioned package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD "package"
          $versionFolder = Join-Path $packageRoot $env:SMART_VOICING_PACKAGE_NAME
          New-Item -ItemType Directory -Force -Path $versionFolder | Out-Null
          Copy-Item -Recurse -Force "build/SmartVoicing_artefacts/Release/VST3/Smart Voicing.vst3" $versionFolder
          Copy-Item -Recurse -Force "build/SmartVoicingARA_artefacts/Release/VST3/Smart Voicing ARA.vst3" $versionFolder

      - name: Upload VST3 package
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Voicing-0.2d-Windows
          path: "package"
