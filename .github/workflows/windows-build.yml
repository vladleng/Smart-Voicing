name: Windows Build

on:
  push:
    branches:
      - main
      - stage-0-project-skeleton
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --target SmartVoicing_VST3 --parallel 2

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Voicing-Windows-VST3
          path: "build/SmartVoicing_artefacts/Release/VST3/Smart Voicing.vst3"
