name: Windows Build

# Keep only the newest push build for each development branch.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - stage-2-midi-router
      - stage-3-chord-harmonizer
      - stage-4-key-aware-engine
      - stage-5-jazz-voicing-engine
      - stage-5-ust-0.4h
      - stage-5-cluster-0.4i
      - stage-5-ui-harma-waves
      - stage-6-voice-leading-0.5a
      - stage-6-voice-leading-0.5b

jobs:
  build:
    runs-on: windows-latest

    env:
      SMART_VOICING_PACKAGE_NAME: "Smart Voicing 0.5b"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --target SmartVoicing_VST3 SmartVoicingARA_VST3 SmartVoicingCoreTests SmartVoicingHarmonizerTests SmartVoicingVoicingStrategyTests SmartVoicingDrop3StrategyTests SmartVoicingDrop24StrategyTests SmartVoicingSpreadStrategyTests SmartVoicingQuartalStrategyTests SmartVoicingUpperStructureTriadTests SmartVoicingClusterStrategyTests SmartVoicingTensionKeyswitchTests SmartVoicingVoicingKeyswitchTests SmartVoicingHarmonyModeKeyswitchTests SmartVoicingLiveReharmonizerTests SmartVoicingKeyAwareTests SmartVoicingTensionPolicyTests SmartVoicingVoiceLeadingTests --parallel 2

      - name: Test Harmony Core
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare versioned package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD "package"
          $versionFolder = Join-Path $packageRoot $env:SMART_VOICING_PACKAGE_NAME
          New-Item -ItemType Directory -Force -Path $versionFolder | Out-Null
          Copy-Item -Recurse -Force "build/SmartVoicing_artefacts/Release/VST3/Smart Voicing.vst3" $versionFolder
          Copy-Item -Recurse -Force "build/SmartVoicingARA_artefacts/Release/VST3/Smart Voicing ARA.vst3" $versionFolder

      - name: Upload VST3 package
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Voicing-0.5b-Windows
          path: "package"
          retention-days: 7
