name: One-time cleanup of artifacts older than 30 days

on:
  push:
    branches:
      - maintenance/purge-old-artifacts-20261026

permissions:
  contents: read
  actions: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only artifacts older than 30 days in Smart-Voicing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "vladleng/Smart-Voicing" ]]; then
            echo "Repository safety check failed: $GITHUB_REPOSITORY"
            exit 1
          fi

          cutoff="$(date -u -d '30 days ago' +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Removing artifacts created before $cutoff (UTC) in $GITHUB_REPOSITORY"
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id")"

          if [[ -z "$ids" ]]; then
            echo "No artifacts older than 30 days found."
            exit 0
          fi

          count=0
          while IFS= read -r artifact_id; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]] || { echo "Invalid artifact ID"; exit 1; }
            echo "Deleting old artifact ID: $artifact_id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            count=$((count + 1))
          done <<< "$ids"
          echo "Deleted $count artifacts older than 30 days."
